server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: produits-service-route
          uri: lb://produits-service
          predicates:
            - Path=/api/produits/**
        - id: categories-service-route
          uri: lb://produits-service
          predicates:
            - Path=/api/categories/**
        - id: avis-service-route
          uri: lb://avis-service
          predicates:
            - Path=/api/avis/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
